name: Atualizar refresh token Supabase Morada Carioca

on:
  workflow_dispatch:
  schedule:
    # 06:00 no horário de Brasília (09:00 UTC)
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: atualizar-refresh-token-morada
  cancel-in-progress: false

jobs:
  atualizar-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Entrar no painel e atualizar token
        env:
          MORADA_USER: ${{ secrets.MORADA_USER }}
          MORADA_PASSWORD: ${{ secrets.MORADA_PASSWORD }}
          APP_SCRIPT_URL: ${{ secrets.APP_SCRIPT_URL }}
          TAMU_INTEGRATION_KEY: ${{ secrets.TAMU_INTEGRATION_KEY }}
        run: python scripts/refresh_morada_token.py
